services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sathwikflow}
      MYSQL_USER: ${MYSQL_USER:-sathwikflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sathwikflow}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_HTTP_PORT:-8025}:8025"

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-sathwikflow}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-sathwikflow}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-sathwikflow}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      SATHWIKFLOW_SECURITY_ALLOWED_ORIGINS_0: http://localhost:5173
      SATHWIKFLOW_SECURITY_COOKIE_SECURE: "false"
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  mysql-data:

