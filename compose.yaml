services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sathwikflow
      MYSQL_USER: sathwik
      MYSQL_PASSWORD: sathwik
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build: ./backend
    depends_on:
      - mysql
      - mailpit
    environment:
      DB_URL: jdbc:mysql://mysql:3306/sathwikflow
      DB_USERNAME: sathwik
      DB_PASSWORD: sathwik
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql-data:
